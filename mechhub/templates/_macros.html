{% macro chart(fig, id) -%}
<div id="{{ id }}" class="chart-box"></div>
<script type="application/json" class="mh-chart" data-target="{{ id }}">{{ fig|safe }}</script>
{%- endmacro %}

{% macro kpi(label, value, unit='', hint='') -%}
<div class="card kpi h-100">
  <div class="label">{{ label }}</div>
  <div class="value">{{ value }} <span class="unit">{{ unit }}</span></div>
  {% if hint %}<div class="small text-muted-2 mt-1">{{ hint }}</div>{% endif %}
</div>
{%- endmacro %}
